server {
    listen 8080;
    host 127.0.0.1;
    server_name server_alpha;
    root ./www;
    index index.html;

    location / {
        allow_methods GET;
        autoindex on;
    }
}

server {
    listen 8081;
    host 127.0.0.1;
    server_name server_beta;
    root ./www;
    index test.html;

    location / {
        allow_methods GET POST;
        autoindex off;
    }
}

server {
    listen 8082;
    host 127.0.0.1;
    server_name server_gamma;
    root ./www;

    location / {
        allow_methods GET;
    }
}

