server {
    listen 8080;
    host 127.0.0.1;
    server_name primary.local;
    root ./www;
    index index.html;

    location / {
        allow_methods GET POST;
        autoindex on;
    }
}

server {
    listen 8080;
    host 127.0.0.1;
    server_name secondary.local api.local;
    root ./www/second_server;
    index index.html;

    location / {
        allow_methods GET;
        autoindex off;
    }
}

