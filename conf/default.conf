server {
    listen 8080;
    host 127.0.0.1;
    server_name localhost webserv.local;
    client_max_body_size 10M;

    root ./www;
    index index.html;

    error_page 400 /errors/400.html;
    error_page 403 /errors/403.html;
    error_page 404 /errors/404.html;
    error_page 405 /errors/405.html;
    error_page 413 /errors/413.html;
    error_page 500 502 504 /errors/500.html;

    location / {
        allow_methods GET POST;
        autoindex on;
        index index.html;
    }

    location /uploads {
        allow_methods GET POST DELETE;
        root ./www/uploads;
        autoindex on;
        upload_enable on;
        upload_store ./www/uploads;
    }

    location /small {
        allow_methods POST;
        client_max_body_size 100;
        upload_enable on;
        upload_store ./www/uploads;
    }

    location /redirect {
        return 301 /;
    }

    location /cgi-bin {
        allow_methods GET POST;
        root ./www/cgi-bin;
        cgi_ext .py /usr/bin/python3;
        cgi_ext .sh /bin/bash;
    }
}

server {
    listen 8081;
    host 127.0.0.1;
    server_name second.local;
    client_max_body_size 5M;

    root ./www/second_server;
    index index.html;

    location / {
        allow_methods GET;
        autoindex off;
    }
}
