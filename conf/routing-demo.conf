# Run from the repository root. This demonstrates routing; main has no server loop yet.
server {
    listen 8080;
    root ./tests/fixtures/site;
    index index.html;
    error_page 404 /errors/404.html;

    location / {
        allow_methods GET HEAD;
    }
    location /listing/ {
        allow_methods GET HEAD;
        autoindex on;
    }
    location /downloads/ {
        alias ./tests/fixtures/downloads;
        allow_methods GET HEAD;
        autoindex on;
    }
    location /old {
        return 301 /new-path;
    }
    location /write-only/ {
        allow_methods POST DELETE;
    }
}
