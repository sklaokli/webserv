server {
    listen 8080;
    host 127.0.0.1;
    server_name webserv.test;
    client_max_body_size 10M;

    root ./www;
    index index.html;

    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;

    location / {
        allow_methods GET;
        autoindex on;
    }

    location /post_body {
        allow_methods POST;
        client_max_body_size 100;
    }

    location /put_test {
        allow_methods PUT;
        root ./www/put_dir;
    }

    location /upload {
        allow_methods POST DELETE;
        upload_enable on;
        upload_store ./www/uploads;
    }

    location /old-page {
        return 301 /;
    }

    location /cgi-bin {
        allow_methods GET POST;
        root ./www/cgi-bin;
        cgi_ext .py /usr/bin/python3;
        cgi_ext .sh /bin/bash;
    }
}

